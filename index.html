<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный Облачный Трекер v9</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 15px;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #fff; margin: 0 0 15px 0; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }

        .cloud-panel {
            background: #1b2838;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #105a8a;
            display: flex;
            gap: 8px;
        }
        .cloud-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            color: white;
        }
        .cloud-btn.save { background: #107c41; }
        .cloud-btn.load { background: #007acc; }

        .add-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #333;
        }
        textarea.add-input {
            width: 100%;
            height: 50px;
            background: #121212;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            padding: 8px;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
        }
        .add-btn {
            background: #444;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .tabs { display: flex; gap: 3px; }
        .tab {
            flex: 1;
            padding: 10px 4px;
            background: #252525;
            border: none;
            color: #777;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
        }
        .tab.active { background: #2a2a2a; color: #fff; }
        #tabQueue.active { border-bottom: 3px solid #1db954; }
        #tabLiked.active { border-bottom: 3px solid #ff4a5a; }
        #tabDisliked.active { border-bottom: 3px solid #ff0000; }

        .list-container {
            background: #2a2a2a;
            border-radius: 0 0 8px 8px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 8px;
            margin-bottom: 16px;
        }
        .album-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #1e1e1e;
            margin-bottom: 5px;
            border-radius: 6px;
            font-size: 13px;
            border-left: 4px solid #333;
        }
        .list-container.active-sessions { background: #1b2838; border-color: #105a8a; max-height: 160px; }
        /* Разделитель между карточками активных сессий */
        .session-item:not(:last-child) {
            border-bottom: 2px dashed #105a8a; /* Пунктирная синяя линия, подходящая под цвет фрейма */
            padding-bottom: 16px;              /* Отступ перед линией */
            margin-bottom: 16px;              /* Отступ после линии */
        }
        .album-item.queue { border-left-color: #1db954; }
        .album-item.liked { border-left-color: #ff4a5a; }
        .album-item.disliked { border-left-color: #7f8c8d; }
        .album-text { flex: 1; maroon: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .actions { display: flex; gap: 4px; }
        .action-btn { background: #333; border: none; color: #fff; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .action-btn.del { background: #cc3333; }

        .services-group { margin: 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .service-item { background: #2a2a2a; padding: 10px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; font-size: 14px; }
        .service-item input { margin-right: 10px; }

        .main-btn { width: 100%; padding: 14px; background: #1db954; border: none; border-radius: 25px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }

        .result-box { margin-top: 15px; padding: 15px; background: #282828; border-radius: 12px; display: none; text-align: center; border: 1px solid #444; }
        .result-title { font-size: 11px; color: #888; text-transform: uppercase; }
        .result-value { font-size: 18px; font-weight: bold; color: #fff; margin: 8px 0; }
        .result-service { font-size: 18px; font-weight: bold; color: #fff; font-weight: 500; margin-bottom: 12px; }
        .listen-btn { display: block; padding: 10px 20px; background: #fff; color: #121212; text-decoration: none; border-radius: 25px; font-weight: bold; margin: 0 auto 12px auto; max-width: 180px; }
        .now-playing-btn { width: 100%; padding: 10px; background: #2c5d88; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 13px; cursor: pointer; margin-bottom: 10px; }
        .now-playing-btn:hover { background: #3672a5; }
        .rate-group { display: flex; gap: 8px; border-top: 1px solid #383838; padding-top: 12px; }
        .rate-btn { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .rate-btn.like { background: #1db954; }
        .rate-btn.neutral { background: #4a4a4a; }
        .rate-btn.dislike { background: #912F2F; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎵 Облачный Рандомизатор</h2>
    
    <!-- Панель облачной синхронизации -->
    <div class="cloud-panel">
        <button class="cloud-btn load" onclick="loadFromCloud()">☁️ Загрузить из таблицы</button>
    </div>
    
    <div class="add-block">
        <textarea id="newAlbumsInput" class="add-input" placeholder="Исполнитель - Альбом..."></textarea>
        <button class="add-btn" onclick="addAlbums()">Добавить релизы ➕</button>
    </div>
    
    <label>🎧 Сейчас слушается на сервисах:</label>
    <div id="activeSessionsContainer" class="list-container active-sessions"></div>

    <!-- Очередь неслушанного -->
    <label>📚 В очереди (неслушанное): (<span id="countQueue">0</span>)</label>
    <div id="listContainer" class="list-container"></div>

    <div class="tabs">
        <button id="tabQueue" class="tab active" onclick="switchTab('queue')">Очередь (<span id="countQueue">0</span>)</button>
        <button id="tabLiked" class="tab" onclick="switchTab('liked')">👍 Like (<span id="countLiked">0</span>)</button>
        <button id="tabDisliked" class="tab" onclick="switchTab('disliked')">👎 Dislike (<span id="countDisliked">0</span>)</button>
    </div>
    
    <div class="services-group">
        <label class="service-item"><input type="checkbox" value="Yandex" checked> Yandex Music</label>
        <label class="service-item"><input type="checkbox" value="Spotify" checked> Spotify</label>
        <label class="service-item"><input type="checkbox" value="YTMusic" checked> YouTube Music</label>
        <label class="service-item"><input type="checkbox" value="Deezer" checked> Deezer</label>
        <label class="service-item"><input type="checkbox" value="Qobuz" checked> Qobuz</label>
    </div>
    
    <button class="main-btn" onclick="generateSelection()">Выбрать альбом и сервис 🎲</button>
    
    <div id="resultBox" class="result-box">
        <div class="result-title">Ваш выбор:</div>
        <div id="resAlbum" class="result-value"></div>
        <div class="result-title">в сервисе:</div>
        <div id="resService" class="result-service"></div>
        <a id="searchLink" class="listen-btn" target="_blank" href="#">Найти и слушать 🚀</a>
        <!-- поле для ввода заметок/мемо -->
        <div class="memo-block">
            <label style="margin-top:0; font-size:12px;">Заметка к альбому (необязательно):</label>
            <input type="text" id="albumMemoInput" class="memo-input" placeholder="Ваши впечатления, треки...">
        </div>

        <!-- Новая кнопка фиксации сессии -->
        <button class="now-playing-btn" onclick="markAsListening()">🎧 Поставить статус: Слушаю сейчас</button>

        <div style="font-size: 11px; color: #888; text-transform: uppercase; margin: 15px 0 5px 0; letter-spacing: 0.5px;">Или завершить с оценкой:</div>
        <div class="rate-group">
            <button class="rate-btn like" onclick="rateLastAlbum('liked')">👍 Like</button>
            <button class="rate-btn neutral" onclick="rateLastAlbum('ok')">Норм</button>
            <button class="rate-btn neutral" onclick="rateLastAlbum('meh')">Такое себе</button>
            <button class="rate-btn dislike" onclick="rateLastAlbum('disliked')">👎 Dislike</button>
        </div>
    </div>
</div>
<script>
// =========================================================================
// НАСТРОЙКА: Вставьте вашу ссылку веб-приложения Google Apps Script (/exec)
// =========================================================================
const SUPABASE_URL = "https://zrwfbyjlyohbygguwfpo.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_ZaFXrDhp8Tx5p_X93DB7wQ_4wPZzyk8";
const TABLE_NAME = "albums_to_listen"; // Имя вашей таблицы в Supabase
// =========================================================================

// Базовый заголовок для авторизации запросов в Supabase
const sHeaders = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json"
};

let queueAlbums = [];
let activeSessions =[];
const serviceNames = { Yandex: "Yandex Music", Spotify: "Spotify", YTMusic: "YouTube Music", Qobuz: "Qobuz", Deezer: "Deezer" };
let lastGeneratedAlbum = null;
let lastGeneratedServiceKey = null;

window.onload = function() {
    loadFromCloud();
};

async function loadFromCloud() {
    try {
        // Запрашиваем данные напрямую из Supabase
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*`, {
            method: "GET",
            headers: sHeaders
        });

        if (!response.ok) {
            const errText = await response.text();
            console.error("Ответ сервера Google:", errText);
            throw new Error(`Статус сервера: ${response.status}`);
        }
        
        const data = await response.json();
        
        queueAlbums = [];
        activeSessions = [];
        
        data.forEach(item => {
            // Проверяем, что объект пришел корректным и содержит поле статуса
            if (item) {
                const status = item.listened ? item.listened.toString().trim().toLowerCase() : "";
                
                if (status === "listening") {
                    activeSessions.push(item);
                } else if (status !== "да" && status !== "yes" && status !== "true" && status !== "added" && status !== "listening") {
                    queueAlbums.push(item);
                }
            }
        });

        const counter = document.getElementById('countQueue');
        if (counter) counter.innerText = queueAlbums.length;

        renderList();
        renderActiveSessions();
    } catch (e) {
        alert("Ошибка загрузки данных из таблицы albums_to_listen:\n" + e.message);
    }
}

// ОТРИСОВКА СПИСКА ОЧЕРЕДИ
function renderList() {
    const container = document.getElementById('listContainer');
    if (!container) return;
    container.innerHTML = "";

    if (queueAlbums.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#666;padding:15px;font-size:13px;">Все альбомы прослушаны! 🎉</div>';
        return;
    }

    const limit = Math.min(queueAlbums.length, 30);
    for (let i = 0; i < limit; i++) {
        const item = document.createElement('div');
        item.style.padding = "6px 10px";
        item.style.marginBottom = "5px";
        item.style.background = "#1e1e1e";
        item.style.borderRadius = "6px";
        item.style.fontSize = "13px";
        item.style.borderLeft = "4px solid #1db954";
        item.innerText = queueAlbums[i].album;
        container.appendChild(item);
    }

    if (queueAlbums.length > 30) {
        const more = document.createElement('div');
        more.style.textAlignment = "center";
        more.style.color = "#666";
        more.style.fontSize = "12px";
        more.style.marginTop = "8px";
        more.innerText = `... и еще ${queueAlbums.length - 30} альбомов в очереди`;
        container.appendChild(more);
    }
}

// Отрисовка НОВОГО фрейма активных сессий прослушивания
function renderActiveSessions() {
    const container = document.getElementById('activeSessionsContainer');
    if (!container) return;
    container.innerHTML = "";

    if (activeSessions.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#888;padding:12px;font-size:13px;font-style:italic;">Нет активных сессий</div>';
        return;
    }

    activeSessions.forEach((album, index) => {
        const item = document.createElement('div');
        item.className = "session-item";
        item.style.flexDirection = "column"; // Разворачиваем карточку вертикально для удобства поля ввода
        item.style.alignItems = "stretch";
    
        const safeName = album.album.replace(/'/g, "\\'");

        // Генерируем уникальный ID для инпута этой сессии, используя индекс
        const inputId = `sessMemo_${index}`;

        // Если заметка уже есть в таблице, подставляем её как дефолтное значение (value)
        const currentMemoValue = album.note ? album.note.replace(/"/g, '&quot;') : "";
    
        // Кнопка быстрого закрытия сессии прямо из списка
        item.innerHTML = `
            <div class="session-info">
                <span class="session-badge">${album.service} | </span> 
                <strong>${album.album}</strong>
            </div>
            
            <!-- Поле ввода комментария прямо внутри карточки сессии -->
            <div style="margin-bottom: 10px;">
                <input type="text" id="${inputId}" class="memo-input" style="margin-top: 0; width: 100%;" 
                       placeholder="Добавить финальные впечатления..." value="${currentMemoValue}">
            </div>
            
            <div class="session-actions" style="justify-content: flex-end; width: 100%; border-top: 1px solid #2c3e50; padding-top: 8px;">
                <!-- Передаем ID инпута в функцию закрытия сессии -->
                <button class="sess-btn liked" onclick="finishSessionDirectly('${album.album}', 'liked', '${inputId}')">👍</button>
                <button class="sess-btn ok" onclick="finishSessionDirectly('${album.album}', 'ok', '${inputId}')">ok</button>
                <button class="sess-btn meh" onclick="finishSessionDirectly('${album.album}', 'meh', '${inputId}')">meh</button>
                <button class="sess-btn disliked" onclick="finishSessionDirectly('${album.album}', 'disliked', '${inputId}')">👎</button>
            </div>
        `;
        container.appendChild(item);
    });
}
// Закрытие сессии напрямую из фрейма кнопками
async function finishSessionDirectly(albumName, ratingValue, inputId) {
    // Находим инпут на экране по его уникальному ID и забираем текст
    const inputElement = document.getElementById(inputId);
    const finalMemo = inputElement ? inputElement.value.trim() : "";

    try {
        const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?album=eq.${encodeURIComponent(albumName)}`;
        
        await fetch(url, {
            method: 'PATCH',
            headers: sHeaders,
            body: JSON.stringify({
                listened: 'true',
                rating: ratingValue,
                note: finalMemo
            })
        });
        loadFromCloud();
    } catch (e) {
        alert("Ошибка: " + e.message);
    }
}
// Команда "Слушаю сейчас" (Фиксация во фрейме и таблице)
async function markAsListening() {
    if (!lastGeneratedAlbum || !lastGeneratedServiceKey) return;
    const memoValue = document.getElementById('albumMemoInput').value.trim();
    
    document.getElementById('resultBox').style.display = 'none';
    
    try {
        const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?album=eq.${encodeURIComponent(lastGeneratedAlbum.album)}`;
        
        await fetch(url, {
            method: 'PATCH',
            headers: sHeaders,
            body: JSON.stringify({ 
                listened: 'listening',
                service: serviceNames[lastGeneratedServiceKey],
                note: memoValue
            })
        });
        document.getElementById('albumMemoInput').value = "";
        loadFromCloud(); 
    } catch (e) {
        alert("Ошибка старта сессии: " + e.message);
    }
}

// ДОБАВЛЕНИЕ НОВОГО АЛЬБОМА ИЗ ВИДЖЕТА В ТАБЛИЦУ
async function addAlbums() {
    const input = document.getElementById('newAlbumsInput').value;
    const lines = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length === 0) return;

    document.getElementById('newAlbumsInput').value = "Добавление...";
    
    // Перебираем и отправляем в таблицу построчно
    for (let line of lines) {
        try {
            await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}`, { 
                method: 'POST',
                headers: sHeaders,
                body: JSON.stringify({ 
                    album: line, 
                    listened: '',
                    rating: '',
                    note: '',
                    service: ''
                }) 
            });
        } catch (e) {
            console.error("Ошибка добавления строки: " + line);
        }
    }

    document.getElementById('newAlbumsInput').value = "";
    alert(`Успешно добавлено релизов: ${lines.length}`);
    loadFromCloud(); // Перезагружаем список
}

// ОТМЕТКА ПРОСЛУШАНО + ОЦЕНКА ИЗ ВИДЖЕТА В ТАБЛИЦУ
async function rateLastAlbum(ratingValue) {
    if (!lastGeneratedAlbum) return;

    const memoValue = document.getElementById('albumMemoInput').value.trim();
  
    document.getElementById('resultBox').style.display = 'none';
    
    try {
        const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?album=eq.${encodeURIComponent(lastGeneratedAlbum.album)}`;
        
        await fetch(url, {
            method: 'PATCH',
            headers: sHeaders,
            body: JSON.stringify({ 
                listened: 'true',
                rating: ratingValue,
                note: memoValue
            })
        });
        // Очищаем поле ввода для следующего раза
        document.getElementById('albumMemoInput').value = "";
        loadFromCloud(); // Обновляем список, альбом исчезнет из очереди
    } catch (e) {
        alert("Ошибка отправки оценки в таблицу: " + e.message);
    }
}

// РАНДОМИЗАТОР
function generateSelection() {
    const checkboxes = document.querySelectorAll('.services-group input:checked');
    const keys = Array.from(checkboxes).map(cb => cb.value);

    if (queueAlbums.length === 0) {
        alert('Очередь альбомов пуста!');
        return;
    }
    if (keys.length === 0) {
        alert('Выберите хотя бы один сервис!');
        return;
    }

    const randomAlbum = queueAlbums[Math.floor(Math.random() * queueAlbums.length)];
    const randomKey = keys[Math.floor(Math.random() * keys.length)];
    
    lastGeneratedAlbum = randomAlbum; // Запоминаем, какой альбом выпал
    lastGeneratedServiceKey = randomKey;

    document.getElementById('resAlbum').innerText = randomAlbum.album;
    document.getElementById('resService').innerText = serviceNames[randomKey];
    document.getElementById('albumMemoInput').value = randomAlbum.note ? randomAlbum.note : "";

    const q = encodeURIComponent(randomAlbum.album);
    let url = "";

    if (randomKey === 'Yandex') url = "https://music.yandex.ru/search?text=" + q;
    else if (randomKey === 'Spotify') url = "https://open.spotify.com/search/" + q;
    else if (randomKey === 'YTMusic') url = "https://music.youtube.com/search?q=" + q;
    else if (randomKey === 'Deezer') url = "https://www.deezer.com/search/" + q + "/album";
    else if (randomKey === 'Qobuz') url = "https://play.qobuz.com/search?query=" + q + "&i=all";

    const btn = document.getElementById('searchLink');
    btn.href = url;
    btn.style.background = randomKey === 'Yandex' ? '#ffcc00' : randomKey === 'Spotify' ? '#1db954' : randomKey === 'YTMusic' ? '#ff0000' : '#000000';
    btn.style.color = randomKey === 'Yandex' ? '#121212' : '#fff';

    document.getElementById('resultBox').style.display = 'block';
}
</script>
</body>
</html>
